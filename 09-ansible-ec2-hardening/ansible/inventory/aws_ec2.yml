plugin: aws_ec2
regions:
  - ap-south-1
filters:
  tag:Environment: staging
  instance-state-name: [running]
hostnames:
  - public-ip-address
  - tag:Name
compose:
  ansible_host: public_ip_address
groups:
  webservers: "tags.Role == 'webserver'"
  staging: "tags.Environment == 'staging'"
keyed_groups:
  - key: tags
    prefix: tag
