- name: Update all packages
  dnf:
    name: "*"
    state: latest

- name: Install essential packages
  dnf:
    name:
      - git
      - curl
      - htop
      - unzip
      - python3
      - python3-pip
    state: present

- name: Set timezone
  timezone:
    name: "{{ timezone }}"

- name: Configure sysctl for performance
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ sysctl_settings }}"
